server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the backend container. Same-origin from the browser's
  # point of view, so cookies work and there's no CORS to configure.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback: any non-file path returns index.html so client-side routing
  # (e.g. /users) works on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
