services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: usermngmt
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d usermngmt -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:app@db:5432/usermngmt?schema=public
      BETTER_AUTH_SECRET: local-demo-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '3000:3000'
    command: sh -c "until bun run prisma:deploy; do echo 'waiting for database...'; sleep 2; done && bun run seed && bun run start"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  db-data:
